name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Type check (mypy)
        run: mypy app || true   # non-blocking during ramp-up
      - name: Tests
        run: pytest -q

  # Eval quality gate: fails the build if RAG retrieval recall drops below threshold.
  eval-gate:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"
      - name: Run eval gate
        run: python eval/run.py --min-score 0.8

  docker:
    runs-on: ubuntu-latest
    needs: [backend, eval-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push api
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-api:latest
            ghcr.io/${{ github.repository }}-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-web:latest
            ghcr.io/${{ github.repository }}-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_STAGING == 'true'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Install helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
      - name: Helm upgrade (staging)
        run: |
          helm upgrade --install ai-kit ./k8s/helm/ai-kit \
            --namespace ai-kit --create-namespace \
            --set api.repository=ghcr.io/${{ github.repository }}-api \
            --set web.repository=ghcr.io/${{ github.repository }}-web \
            --set api.tag=${{ github.sha }} \
            --set web.tag=${{ github.sha }} \
            --set imageCredentials.create=true \
            --set imageCredentials.username=${{ github.actor }} \
            --set imageCredentials.password=${{ secrets.GITHUB_TOKEN }} \
            --set secrets.jwtSecret=${{ secrets.STAGING_JWT_SECRET }} \
            --wait
