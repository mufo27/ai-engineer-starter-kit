apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-kit.fullname" . }}-api
  labels:
    {{- include "ai-kit.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ai-kit.apiSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-kit.apiSelectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.api.port | quote }}
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "ai-kit.serviceAccountName" . }}
      {{- if .Values.imageCredentials.create }}
      imagePullSecrets:
        - name: {{ include "ai-kit.fullname" . }}-registry
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.repository }}:{{ .Values.api.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: {{ .Values.api.port }} }]
          envFrom:
            - configMapRef: { name: {{ include "ai-kit.fullname" . }}-config }
            - secretRef: { name: {{ include "ai-kit.fullname" . }}-secrets }
          readinessProbe:
            httpGet: { path: /health, port: {{ .Values.api.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: {{ .Values.api.port }} }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-kit.fullname" . }}-api
  labels:
    {{- include "ai-kit.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "ai-kit.apiSelectorLabels" . | nindent 4 }}
  ports:
    - port: 80
      targetPort: {{ .Values.api.port }}
---
{{- if .Values.api.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ai-kit.fullname" . }}-api
  labels:
    {{- include "ai-kit.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ai-kit.fullname" . }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
