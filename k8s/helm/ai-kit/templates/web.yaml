apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-kit.fullname" . }}-web
  labels:
    {{- include "ai-kit.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "ai-kit.webSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-kit.webSelectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ai-kit.serviceAccountName" . }}
      containers:
        - name: web
          image: "{{ .Values.web.repository }}:{{ .Values.web.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: {{ .Values.web.port }} }]
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://api.{{ .Values.ingress.host }}"
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-kit.fullname" . }}-web
  labels:
    {{- include "ai-kit.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    {{- include "ai-kit.webSelectorLabels" . | nindent 4 }}
  ports:
    - port: 80
      targetPort: {{ .Values.web.port }}
